[build]
  publish = "public"
[build.environment]
  NODE_VERSION = "20"
[functions]
  directory = "netlify/functions"
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
