<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Palm Oil Manager</title>
<style>
:root{--bg:#f4f6f1;--c:#fff;--t:#1d2a1f;--m:#6b7a6d;--p:#2f6b3a;--a:#d98a12;--l:#dfe5da;--r:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121a14;--c:#1b261e;--t:#e8efe9;--m:#9bab9e;--p:#57b068;--l:#2b3a2e}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.o{background:none;color:var(--p);border:1px solid var(--p)}.btn.d{background:var(--r)}.btn.s{padding:5px 9px;font-size:13px}
input,select{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--c)}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 3px}
header{background:var(--p);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header b{flex:1;font-size:17px}header select{width:auto;padding:6px;background:#fff;color:#111}
.top{position:sticky;top:0;z-index:5}nav{display:flex;background:var(--c);border-bottom:1px solid var(--l)}
nav a{flex:1;text-align:center;padding:7px 2px;color:var(--m);font-size:12px;cursor:pointer}nav a b{display:block;font-size:18px}nav a.on{color:var(--p);font-weight:700}
main{padding:14px;max-width:1150px;margin:auto}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.bar h2{margin:0;flex:1;font-size:19px}.bar select{width:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--m);font-size:12px;text-transform:uppercase}
tr.tot td{font-weight:700;background:var(--bg)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k div{background:var(--bg);border-radius:10px;padding:10px}.k small{color:var(--m)}.k b{display:block;font-size:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}.bars div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--a);border-radius:5px 5px 0 0;min-height:2px}
.err{color:var(--r);min-height:20px}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.ov{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.ph{display:none}
@media(min-width:760px){body{padding:0 0 0 190px}nav{position:fixed;top:0;bottom:0;left:0;width:190px;flex-direction:column;border-bottom:0;border-right:1px solid var(--l);padding-top:64px}
nav a{text-align:left;padding:14px 20px;font-size:15px}nav a b{display:inline;margin-right:8px}.ov{align-items:center}.md{border-radius:18px}header{margin-left:-190px;padding-left:204px}}
@media print{header,nav,.noprint,.bar{display:none!important}body{padding:0;background:#fff;color:#000}.ph{display:block}.card{border:0;padding:0}.sc{overflow:visible}td,th{padding:4px 6px;font-size:11px}}
</style></head><body>
<div id="login" hidden><div class="card"><h2>🌴 Palm Oil Manager</h2>
<form onsubmit="return A.login(event)"><label>Username</label><input name="u" autocomplete="username" required>
<label>Password</label><input name="p" type="password" autocomplete="current-password" required>
<p class="err" id="le"></p><button class="btn" style="width:100%">Sign in</button></form></div></div>
<div id="app" hidden></div><div id="modal"></div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(v,d=0)=>(+v||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}),D=s=>s?s.split('-').reverse().join('-'):'';
const MN=['April','May','June','July','August','September','October','November','December','January','February','March'],M3=MN.map(m=>m.slice(0,3));
const FYS=Array.from({length:20},(_,i)=>`${2015+i}-${String(2016+i).slice(2)}`);
const fyOf=s=>{const[y,m]=s.split('-').map(Number),st=m>=4?y:y-1;return`${st}-${String(st+1).slice(2)}`};
const S={tok:localStorage.pt||'',u:null,de:[],exp:[],fy:fyOf(new Date().toISOString().slice(0,10)),page:'de',rep:'md',mon:'all',mdFy:'all',cm:'t',ck:'q',users:[]};
const sum=a=>a.reduce((s,v)=>s+v,0),xt=r=>(r.tripsAmt||0)+(r.labourAmt||0)+(r.pestAmt||0)+(r.manureAmt||0);
const can=()=>S.u.role!=='viewer';
async function api(a,b={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.tok},body:JSON.stringify({action:a,...b})});
 const j=await r.json().catch(()=>({error:'Server error'}));if(r.status===401&&a!=='login'){A.out();throw Error(j.error)}if(!r.ok)throw Error(j.error||'Error');return j}
function agg(fy){const q=Array(12).fill(0),a=Array(12).fill(0),x=Array(12).fill(0);
 S.de.forEach(r=>{if(r.fy===fy){q[r.m]+=r.qty||0;a[r.m]+=r.amount||0}});S.exp.forEach(r=>{if(r.fy===fy)x[r.m]+=xt(r)});return{q,a,x}}
const has=fy=>{const g=agg(fy);return sum(g.q)+sum(g.a)+sum(g.x)>0};
const FD={de:[['qtyDate','Qty date','date'],['qty','Qty (Tons)','num'],['amtDate','Payment date','date'],['amount','Amount (₹)','num']],
 exp:[['date','Date','date'],['trips','Auto trips','text'],['tripsAmt','Auto amount (₹)','num'],['labour','No. of labour','text'],['labourAmt','Labour amount (₹)','num'],['pest','Pesticides','text'],['pestAmt','Pesticides amount (₹)','num'],['manure','Manure','text'],['manureAmt','Manure amount (₹)','num']]};
const opts=(a,v)=>a.map((x,i)=>`<option value="${Array.isArray(x)?x[0]:x}"${(Array.isArray(x)?x[0]:x)==v?' selected':''}>${E(Array.isArray(x)?x[1]:x)}</option>`).join('');
const monSel=all=>`<select onchange="S.mon=this.value;R()">${all?'<option value="all">All months</option>':''}${opts(MN.map((m,i)=>[i,m]),S.mon)}</select>`;
function table(head,body,tot){return`<div class="sc"><table><tr>${head.map(h=>`<th>${E(h)}</th>`).join('')}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="tot">${tot.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</table></div>`}
const acts=(k,r)=>can()?`<button class="btn o s" onclick="A.form('${k}','${r.id}')">Edit</button> <button class="btn d s" onclick="A.del('${k}','${r.id}')">✕</button>`:'';
function page(){
 if(S.page==='de'||S.page==='exp'){const k=S.page,rows=S[k].filter(r=>r.fy===S.fy&&(S.mon==='all'||r.m==S.mon)).sort((a,b)=>a.m-b.m||(a.qtyDate||a.date||a.amtDate||'').localeCompare(b.qtyDate||b.date||b.amtDate||''));
  const bar=`<div class="bar"><h2>${k==='de'?'DE – Qty & Amount':'EXP – Expenditure'} · ${S.fy}</h2>${monSel(1)}${can()?`<button class="btn" onclick="A.form('${k}')">+ Add</button>`:''}</div>`;
  if(k==='de')return bar+`<div class="card">`+table(['Month','Qty date','Qty (T)','Pay date','Amount (₹)',''],rows.map(r=>[M3[r.m],D(r.qtyDate),r.qty==null?'':N(r.qty,2),D(r.amtDate),r.amount==null?'':N(r.amount),acts(k,r)]),['Total','',N(sum(rows.map(r=>r.qty||0)),2),'',N(sum(rows.map(r=>r.amount||0))),''])+`</div>`;
  return bar+`<div class="card">`+table(['Month','Date','Auto','Auto ₹','Labour','Labour ₹','Pesticides','Pest ₹','Manure','Manure ₹','Total ₹',''],rows.map(r=>[M3[r.m],D(r.date),E(r.trips),N(r.tripsAmt),E(r.labour),N(r.labourAmt),E(r.pest),N(r.pestAmt),E(r.manure),N(r.manureAmt),N(xt(r)),acts(k,r)]),['Total','','','','','','','','','',N(sum(rows.map(xt))),''])+`</div>`}
 if(S.page==='rep')return repPage();
 if(S.page==='adm')return`<div class="bar"><h2>Users</h2><button class="btn" onclick="A.uform()">+ New user</button></div><div class="card">`+table(['User','Name','Role','Active',''],S.users.map(u=>[E(u.username),E(u.name),u.role,u.active?'Yes':'No',`<button class="btn o s" onclick="A.uform('${E(u.username)}')">Edit</button> <button class="btn d s" onclick="A.udel('${E(u.username)}')">✕</button>`]))+`<p style="color:var(--m)">Admin: everything · Editor: add/edit data · Viewer: reports only.</p></div>`}
function mdModel(){return(S.mdFy==='all'?FYS.filter(has):[S.mdFy]).map(fy=>{const g=agg(fy),row=(n,a,d)=>[n,...a.map(v=>v?N(v,d):'-'),N(sum(a),d)];
 return{title:'Financial year '+fy,head:['',...M3,'Total'],body:[row('Qty (Tons)',g.q,2),row('Amount (Rs)',g.a,0),row('Exp (Rs)',g.x,0),row('Net (Rs)',g.a.map((v,i)=>v-g.x[i]),0)]}})}
function cmpModel(){const yrs=FYS.filter(has),k=S.ck,d=k==='q'?2:0,val=fy=>{const g=agg(fy)[k];return S.cm==='t'?sum(g):g[S.cm]},vs=yrs.map(val),nz=yrs.map((f,i)=>[f,vs[i]]).filter(x=>x[1]>0),unit=k==='q'?'Tons':'Rs';
 const mx=nz.length?nz.reduce((a,b)=>b[1]>a[1]?b:a):['-',0],mn=nz.length?nz.reduce((a,b)=>b[1]<a[1]?b:a):['-',0],gs=yrs.map(agg);
 const tq=sum(gs.map(g=>sum(g.q))),ta=sum(gs.map(g=>sum(g.a))),tx=sum(gs.map(g=>sum(g.x))),n=yrs.length||1;
 return{yrs,vs,d,unit,title:`Comparison – ${S.cm==='t'?'Full year':MN[S.cm]} – ${{q:'Qty',a:'Amount',x:'Expenditure'}[k]}`,
  table:{head:['Financial year',unit],body:yrs.map((f,i)=>[f,N(vs[i],d)])},
  stats:[['Maximum',N(mx[1],d)+' in '+mx[0]],['Minimum (non-zero)',N(mn[1],d)+' in '+mn[0]],['Average',N(nz.length?sum(nz.map(x=>x[1]))/nz.length:0,d)+' over '+nz.length+' years']],
  tot:[['Total qty of yielding',N(tq,2)+' Tons'],['Total amount','Rs '+N(ta)],['Total expenditure','Rs '+N(tx)],['Average qty per year',N(tq/n,2)+' Tons'],['Average amount per year','Rs '+N(ta/n)],['Average expenditure per year','Rs '+N(tx/n)]]}}
function repPage(){const tabs=`<div class="bar noprint"><button class="btn ${S.rep==='md'?'':'o'}" onclick="S.rep='md';R()">Monthly data (MD)</button><button class="btn ${S.rep==='cmp'?'':'o'}" onclick="S.rep='cmp';R()">Comparison</button><span style="flex:1"></span><button class="btn o" onclick="A.pdf()">⬇ PDF</button><button class="btn o" onclick="print()">🖨 Print</button></div>`;
 const ph=`<div class="ph"><h2>Palm Oil – ${S.rep==='md'?'Monthly Data Report':'Comparison Report'}</h2><p>Printed ${new Date().toLocaleDateString('en-IN')}</p></div>`;
 if(S.rep==='md')return tabs+`<div class="bar noprint"><h2>Monthly data</h2><select onchange="S.mdFy=this.value;R()"><option value="all">All years with data</option>${opts(FYS,S.mdFy)}</select></div>${ph}`+(mdModel().map(t=>`<div class="card"><h3>${t.title}</h3>${table(t.head,t.body)}</div>`).join('')||'<div class="card">No data.</div>');
 const c=cmpModel(),mx=Math.max(...c.vs,1);
 return tabs+`<div class="bar noprint"><h2>Comparison</h2><select onchange="S.cm=this.value;R()">${opts([['t','Full year'],...MN.map((m,i)=>[i,m])],S.cm)}</select><select onchange="S.ck=this.value;R()">${opts([['q','Qty'],['a','Amount'],['x','Expenditure']],S.ck)}</select></div>${ph}
 <div class="card"><h3>${c.title}</h3><div class="bars">${c.yrs.map((f,i)=>`<div title="${f}: ${N(c.vs[i],c.d)}"><small>${c.vs[i]?N(c.vs[i],c.d):''}</small><i style="height:${c.vs[i]/mx*75}%"></i><small>${f.slice(2,4)}-${f.slice(5)}</small></div>`).join('')}</div></div>
 <div class="card"><div class="k">${c.stats.map(s=>`<div><small>${s[0]}</small><b>${E(s[1])}</b></div>`).join('')}</div></div>
 <div class="card"><h3>Total report</h3><div class="k">${c.tot.map(s=>`<div><small>${s[0]}</small><b>${E(s[1])}</b></div>`).join('')}</div></div>
 <div class="card">${table(c.table.head,c.table.body)}</div>`}
function R(){if(!S.u)return;const nav=[['de','🧺','DE'],['exp','💸','EXP'],['rep','📊','Reports'],...(S.u.role==='admin'?[['adm','👥','Users']]:[])];
 $('#app').innerHTML=`<div class="top"><header><b>🌴 Palm Oil</b><select onchange="S.fy=this.value;R()">${opts(FYS,S.fy)}</select><button class="btn o s" style="color:#fff;border-color:#fff" onclick="A.acct()">${E(S.u.name)} ▾</button></header>
 <nav>${nav.map(n=>`<a class="${S.page===n[0]?'on':''}" onclick="S.page='${n[0]}';A.go()"><b>${n[1]}</b>${n[2]}</a>`).join('')}</nav></div><main>${page()}</main>`}
const modal=h=>{$('#modal').innerHTML=h?`<div class="ov" onclick="if(event.target===this)A.x()"><div class="md">${h}</div></div>`:''};
const A={x:()=>modal(''),
 async login(e){e.preventDefault();const f=e.target;try{const j=await api('login',{username:f.u.value,password:f.p.value});S.tok=localStorage.pt=j.token;await A.boot()}catch(x){$('#le').textContent=x.message}return false},
 out(){localStorage.removeItem('pt');S.tok='';S.u=null;$('#app').hidden=true;$('#login').hidden=false},
 async boot(){try{const j=await api('get');Object.assign(S,{de:j.de,exp:j.exp,u:j.user});$('#login').hidden=true;$('#app').hidden=false;R()}catch(x){$('#login').hidden=false}},
 async go(){if(S.page==='adm')try{S.users=(await api('users')).users}catch(x){alert(x.message)}R();scrollTo(0,0)},
 form(k,id){const r=id?S[k].find(x=>x.id===id):{fy:S.fy,m:S.mon==='all'?0:+S.mon};
  modal(`<h3>${id?'Edit':'New'} ${k==='de'?'DE entry':'expense'}</h3><form onsubmit="return A.save(event,'${k}','${id||''}')"><div class="g2"><div><label>Financial year</label><select name="fy">${opts(FYS,r.fy)}</select></div><div><label>Month (for reports)</label><select name="m">${opts(MN.map((m,i)=>[i,m]),r.m)}</select></div>
  ${FD[k].map((f,i)=>`<div><label>${f[1]}</label><input name="${f[0]}" ${f[2]==='num'?'type="number" step="any" min="0" inputmode="decimal"':f[2]==='date'?'type="date"':'maxlength="60"'} value="${E(r[f[0]]??'')}" ${i===0?'onchange="A.dc(this)"':''}></div>`).join('')}</div>
  <p class="err" id="fe"></p><div class="bar"><button class="btn">Save</button><button type="button" class="btn o" onclick="A.x()">Cancel</button></div></form>`)},
 dc(i){if(!i.value)return;const f=i.form;f.fy.value=fyOf(i.value);f.m.value=(+i.value.slice(5,7)+8)%12},
 async save(e,k,id){e.preventDefault();const f=e.target,rec={id};new FormData(f).forEach((v,n)=>rec[n]=v);
  try{const j=await api('save',{kind:k,rec});const i=S[k].findIndex(x=>x.id===j.rec.id);i>=0?S[k][i]=j.rec:S[k].push(j.rec);S.fy=j.rec.fy;A.x();R()}catch(x){$('#fe').textContent=x.message}return false},
 async del(k,id){if(!confirm('Delete this entry?'))return;try{await api('remove',{kind:k,id});S[k]=S[k].filter(x=>x.id!==id);R()}catch(x){alert(x.message)}},
 acct(){modal(`<h3>${E(S.u.name)} (${S.u.role})</h3><form onsubmit="return A.pw(event)"><label>Current password</label><input name="o" type="password" autocomplete="current-password" required><label>New password (8+ chars)</label><input name="n" type="password" autocomplete="new-password" minlength="8" required><p class="err" id="fe"></p>
  <div class="bar"><button class="btn">Change password</button><button type="button" class="btn d" onclick="A.x();A.out()">Sign out</button></div></form>`)},
 async pw(e){e.preventDefault();try{await api('pw',{old:e.target.o.value,new:e.target.n.value});A.x();alert('Password changed')}catch(x){$('#fe').textContent=x.message}return false},
 uform(un){const u=S.users.find(x=>x.username===un)||{role:'editor',active:true};
  modal(`<h3>${un?'Edit':'New'} user</h3><form onsubmit="return A.usave(event)"><label>Username</label><input name="username" value="${E(u.username||'')}" ${un?'readonly':''} required><label>Name</label><input name="name" value="${E(u.name||'')}"><label>Role</label><select name="role">${opts(['admin','editor','viewer'],u.role)}</select>
  <label>${un?'New password (leave blank to keep)':'Password (8+ chars)'}</label><input name="password" type="password" autocomplete="new-password" ${un?'':'required'}><label><input type="checkbox" name="active" style="width:auto" ${u.active?'checked':''}> Active</label><p class="err" id="fe"></p><div class="bar"><button class="btn">Save</button><button type="button" class="btn o" onclick="A.x()">Cancel</button></div></form>`)},
 async usave(e){e.preventDefault();const f=e.target;try{S.users=(await api('usave',{username:f.username.value,name:f.name.value,role:f.role.value,password:f.password.value,active:f.active.checked})).users;A.x();R()}catch(x){$('#fe').textContent=x.message}return false},
 async udel(u){if(!confirm('Delete user '+u+'?'))return;try{S.users=(await api('udel',{username:u})).users;R()}catch(x){alert(x.message)}},
 pdf(){if(!window.jspdf)return alert('PDF library could not load. Use Print and choose "Save as PDF".');
  const doc=new jspdf.jsPDF({orientation:'l',format:'a4'});let y=14;const H=t=>{doc.setFontSize(13);doc.text(t,14,y);y+=4};
  doc.setFontSize(16);doc.text('Palm Oil – '+(S.rep==='md'?'Monthly Data Report':'Comparison Report'),14,y);y+=6;doc.setFontSize(9);doc.text('Generated '+new Date().toLocaleDateString('en-IN')+' by '+S.u.name,14,y);y+=6;
  const T=(h,b,o={})=>{doc.autoTable({startY:y,head:[h],body:b,styles:{fontSize:8,halign:'right'},columnStyles:{0:{halign:'left'}},headStyles:{fillColor:[47,107,58]},...o});y=doc.lastAutoTable.finalY+8};
  if(S.rep==='md')mdModel().forEach(t=>{if(y>150){doc.addPage();y=14}H(t.title);T(t.head,t.body)});
  else{const c=cmpModel(),mx=Math.max(...c.vs,1);H(c.title);const w=250/Math.max(c.yrs.length,1);
   c.vs.forEach((v,i)=>{const h=v/mx*45;doc.setFillColor(217,138,18);doc.rect(14+i*w+1,y+50-h,w-3,h,'F');doc.setFontSize(6);doc.text(c.yrs[i].slice(2),14+i*w+1,y+54)});y+=60;
   T(['Statistic','Value'],c.stats,{tableWidth:120});T(['Total report','Value'],c.tot,{tableWidth:120});T(c.table.head,c.table.body,{tableWidth:120})}
  doc.save(`palm-oil-${S.rep==='md'?'monthly':'comparison'}-${new Date().toISOString().slice(0,10)}.pdf`)}};
S.tok?A.boot():$('#login').hidden=false;
</script></body></html>
